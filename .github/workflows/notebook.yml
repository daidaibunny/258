name: Check notebook

on: [push, pull_request]

permissions:
  contents: read

jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.8.19"
      - run: uv sync --locked --python 3.12
      - run: uv run --locked ruff check seoul_bike_demand.ipynb
      - name: Execute notebook and verify HTML export
        run: |
          uv run --locked jupyter nbconvert --execute --to html --output workbook seoul_bike_demand.ipynb
          test -s workbook.html
