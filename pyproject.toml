[project]
name = "seoul-bike-demand"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
	"ipykernel>=6",
	"jupyterlab>=4,<5",
	"matplotlib>=3.8",
	"nbconvert>=7,<8",
	"numpy>=1.26",
	"pandas>=2.2",
	"scikit-learn>=1.5",
]

[dependency-groups]
dev = ["ruff", "ty"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
